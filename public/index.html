<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomfoolery</title>
<meta name="description" content="Tiny web games. Name a fruit. Any fruit except apple.">
<meta name="theme-color" content="#FBF6EC">
<meta property="og:title" content="Tomfoolery">
<meta property="og:description" content="Tiny web games. Name a fruit. Any fruit except apple.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    background: #FBF6EC; color: #2A211A; font-family: "DM Sans", system-ui, sans-serif; }
  header { padding: 28px 40px; }
  .wm { font-size: 20px; font-weight: 600; letter-spacing: -.03em; color: inherit; text-decoration: none; }
  .wm b { display: inline-block; font-weight: inherit; color: #E4572E; transform: rotate(-14deg) translateY(-1px); }
  main { padding: 16px 40px 32px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 24px;
    grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tile { display: flex; flex-direction: column; justify-content: space-between; height: 236px;
    padding: 20px 22px; border-radius: 8px; background: var(--tint); color: inherit; text-decoration: none;
    transition: transform .15s ease; }
  .tile[href]:hover { transform: translateY(-2px); }
  .tile img { display: block; width: 150px; height: 150px; margin: -8px auto 0; }
  .tile span { font-size: 18px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; white-space: nowrap; }
  footer { margin-top: auto; padding: 24px; text-align: center; font-size: 12px; color: #8A7B6E; }
  @media (max-width: 1023px) { ul { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 639px) {
    body { padding: 0 20px; }
    header { padding: 24px 0; }
    main { padding: 32px 0; }
    ul { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .tile { height: auto; aspect-ratio: 1; padding: 0; justify-content: center; align-items: center; gap: 12px; }
    .tile img { width: 68px; height: 68px; margin: 0; }
    .tile span { font-size: 13px; font-weight: 500; letter-spacing: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>
<header><a class="wm" href="/">Tomf<b>o</b>olery</a></header>
<main>
  <ul>
    <li><a class="tile" href="/fruit/" style="--tint:#FFE9A8"><img src="/icons/name-a-fruit.svg" alt="" width="150" height="150"><span>Name a Fruit</span></a></li>
    <li><a class="tile" style="--tint:#FFD9C2" aria-disabled="true"><img src="/icons/unpopular-opinion.svg" alt="" width="150" height="150"><span>Unpopular Opinion</span></a></li>
    <li><a class="tile" style="--tint:#D3F1D8" aria-disabled="true"><img src="/icons/brain-age.svg" alt="" width="150" height="150"><span>Brain Age</span></a></li>
    <li><a class="tile" style="--tint:#D5E8FB" aria-disabled="true"><img src="/icons/the-button.svg" alt="" width="150" height="150"><span>The Button</span></a></li>
    <li><a class="tile" style="--tint:#FFD6DF" aria-disabled="true"><img src="/icons/right-now.svg" alt="" width="150" height="150"><span>Right Now</span></a></li>
    <li><a class="tile" style="--tint:#E6DCFA" aria-disabled="true"><img src="/icons/are-you-predictable.svg" alt="" width="150" height="150"><span>Are You Predictable</span></a></li>
  </ul>
</main>
<footer>© 2026</footer>

</body>
</html>
