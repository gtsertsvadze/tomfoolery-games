<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tomfoolery.games — tiny games</title>
<meta name="description" content="tomfoolery.games: tiny web games. Name a fruit. Any fruit except apple.">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #000;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 20px 32px; text-align: center; }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px; }
  p.sub { margin: 0 0 32px; font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px; }
  .tile { display: block; border: 2px solid #000; border-radius: 12px;
    padding: 24px 12px; text-decoration: none; color: #000; }
  .tile:hover { background: #f2f2f2; }
  .tile .emoji { font-size: 44px; display: block; margin-bottom: 8px; }
  .tile .name { font-size: 16px; font-weight: 600; }
  footer { text-align: center; font-size: 13px; padding: 24px 0 32px; }
</style>
</head>
<body>
<main>
  <h1>tomfoolery.games</h1>
  <p class="sub">tiny games</p>
  <div class="grid">
    <a class="tile" href="/fruit/">
      <span class="emoji">🍇</span>
      <span class="name">Name a Fruit</span>
    </a>
  </div>
</main>
<footer>© 2026 tomfoolery.games</footer>
