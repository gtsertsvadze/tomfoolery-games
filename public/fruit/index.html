<head>

<meta property="og:title" content="Name a Fruit">
<meta property="og:description" content="Name a fruit. Any fruit except apple. How rare is your answer?">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tomfoolery.games/fruit/">
<meta property="og:image" content="https://tomfoolery.games/og/fruit.png">

<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    background: #fff; color: #111;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { width: 100%; max-width: 480px; margin: 0 auto; padding: 24px 20px 40px; text-align: center; }
  .back { display: inline-block; margin-bottom: 9vh; color: #999; font-size: 14px; text-decoration: none; }
  .back:hover { color: #111; }
  .emoji { font-size: 64px; line-height: 1; margin: 0 0 12px; }
  h1 { margin: 0; font-size: clamp(30px, 8vw, 40px); font-weight: 800; letter-spacing: -.03em; }
  .sub { margin: 6px 0 28px; color: #777; font-size: 18px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 12px 16px; color: inherit;
    background: #fff; border: 1.5px solid #ddd; border-radius: 14px; outline: none;
    transition: border-color .15s; }
  input:focus { border-color: #111; }
  input::placeholder { color: #bbb; }
  button { font: inherit; font-size: 16px; font-weight: 600; padding: 12px 20px; cursor: pointer;
    background: #111; color: #fff; border: 0; border-radius: 14px; transition: transform .1s, opacity .15s; }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: .5; cursor: default; transform: none; }
  button:focus-visible, .back:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
  #msg { min-height: 22px; margin: 10px 0 0; font-size: 15px; color: #c0392b; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  #result { margin-top: 24px; padding: 26px 20px 22px; border: 1.5px solid #111; border-radius: 20px;
    animation: pop .25s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  #r-fruit { margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1;
    overflow-wrap: anywhere; }
  #r-verdict { margin: 10px 0 0; font-size: 17px; }
  #r-stat { display: inline-block; margin: 14px 0 18px; padding: 6px 14px; border-radius: 999px;
    background: #f2f2f2; font-size: 14px; font-weight: 600; }
  #share { display: block; width: 100%; padding: 13px; }
  #fallback { display: block; margin-top: 12px; padding: 10px 12px; border: 1px dashed #ccc;
    border-radius: 10px; font-size: 14px; text-align: left; user-select: all; }
  [hidden] { display: none !important; }
  #top { margin-top: 36px; }
  h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #999; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: baseline; gap: 12px; padding: 7px 12px; border-radius: 10px; font-size: 16px;
    background: linear-gradient(90deg, #f3f3f3 var(--w), transparent 0); }
  li + li { margin-top: 4px; }
  .rank { width: 1em; color: #aaa; font-size: 13px; font-variant-numeric: tabular-nums; }
  .f { flex: 1; text-align: left; text-transform: capitalize; }
  .n { color: #777; font-size: 14px; font-variant-numeric: tabular-nums; }
  #total { margin: 12px 0 0; font-size: 13px; color: #999; }
  .argue { margin: 36px 0 0; font-size: 13px; color: #999; line-height: 1.5; }
  footer { margin-top: auto; padding: 24px 20px; text-align: center; font-size: 12px; color: #aaa; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <a class="back" href="/">← tomfoolery.games</a>
  <p class="emoji" aria-hidden="true">🍎</p>
  <h1>Name a fruit.</h1>
  <p class="sub">Any fruit except apple.</p>
  <form id="form" autocomplete="off">
    <input id="input" type="text" maxlength="40" placeholder="e.g. medlar" aria-label="Name a fruit"
      autofocus autocapitalize="off" spellcheck="false" enterkeyhint="go">
    <button type="submit" id="go">Go</button>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>
  <section id="result" hidden aria-live="polite">
    <p id="r-fruit"></p>
    <p id="r-verdict"></p>
    <p id="r-stat"></p>
    <button id="share" type="button">Share</button>
    <output id="fallback" hidden></output>
  </section>
  <section id="top" hidden>
    <h2>Today's top 5</h2>
    <ol id="top-list"></ol>
    <p id="total"></p>
  </section>
  <p class="argue">Arguing with the rules? Botanical fruits count. Yes, tomato is a fruit. Apple is still banned.</p>
</main>
<footer>© 2026 tomfoolery.games</footer>
<script>
const el = (id) => document.getElementById(id);
const form = el('form'), input = el('input'), goBtn = el('go'), msg = el('msg');
const result = el('result'), rFruit = el('r-fruit'), rVerdict = el('r-verdict'), rStat = el('r-stat');
const shareBtn = el('share'), fallback = el('fallback');
const topEl = el('top'), topList = el('top-list'), totalEl = el('total');

const MOCKING = [
  '{F}. Groundbreaking. The fruit equivalent of answering "blue".',
  '{F}. Wow. Did you also name your dog "Dog"?',
  '{F}. A bold choice, if this were 1994.',
  '{F} again. The hive mind thanks you for your service.',
  '{F}. Your imagination has been notified.'
];
const MID = [
  '{F}. Not bad. Not medlar, but not bad.',
  '{F}. Respectable. Deeply mid. Respectable.',
  '{F}. Solid. Nobody will remember it, but solid.'
];
const BRAG = [
  '{F}?? Okay, show-off. Framed and mounted.',
  '{F}. Absolutely nobody else would have said that. Respect.',
  '{F}. The connoisseur’s choice. Or a misclick. Either way: legend.',
  '{F}. You’ve clearly been waiting your whole life for this question.'
];

function pick(arr, seed) {
  let h = 0;
  for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return arr[h % arr.length];
}
const people = (n) => n === 1 ? '1 person' : n + ' people';
const cap = (s) => s[0].toUpperCase() + s.slice(1);

let shareText = '';

// Native share sheets only make sense on phones/tablets. On desktop, Chrome and
// Edge open the OS share dialog (which tends to suggest Mail), so we copy instead.
const MOBILE = !!navigator.share && (
  (navigator.userAgentData && navigator.userAgentData.mobile) ||
  /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  matchMedia('(hover: none) and (pointer: coarse)').matches);

function renderTop(top, total) {
  topEl.hidden = !top.length;
  if (!top.length) return;
  topList.textContent = '';
  const max = top[0].count || 1;
  top.forEach((t, i) => {
    const li = document.createElement('li');
    li.style.setProperty('--w', Math.round(t.count / max * 100) + '%');
    for (const [cls, text] of [['rank', i + 1], ['f', t.fruit], ['n', t.count]]) {
      const s = document.createElement('span');
      s.className = cls; s.textContent = text; li.appendChild(s);
    }
    topList.appendChild(li);
  });
  totalEl.textContent = people(total) + ' have answered so far.';
}

async function loadTop() {
  try {
    const r = await fetch('/api/fruit/top');
    if (!r.ok) return;
    const d = await r.json();
    renderTop(d.top || [], d.total || 0);
  } catch { /* offline: stay quiet */ }
}

function fail(text) {
  msg.textContent = text;
  input.classList.remove('shake');
  void input.offsetWidth;
  input.classList.add('shake');
  input.select();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = '';
  const answer = input.value.trim();
  if (!answer) return;
  goBtn.disabled = true;
  try {
    const r = await fetch('/api/fruit/answer', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ answer })
    });
    const d = await r.json();
    if (!d.ok) return fail(d.error || 'Hmm. Try again.');
    const F = cap(d.fruit);
    rFruit.textContent = F;
    const pool = d.rarerThan >= 90 ? BRAG : d.rarerThan >= 50 ? MID : MOCKING;
    rVerdict.textContent = pick(pool, d.fruit + d.count).replaceAll('{F}', F);
    let stat;
    if (d.total < 300) {
      rStat.textContent = people(d.count) + ' said ' + d.fruit + '.';
      stat = d.count === 1 ? 'Nobody else has.' : people(d.count) + ' said that.';
    } else {
      rStat.textContent = 'Rarer than ' + d.rarerThan + '% of players';
      stat = 'Rarer than ' + d.rarerThan + '% of players.';
    }
    shareText = '\u{1F34E} Name a Fruit: I said ' + d.fruit + '. ' + stat + ' tomfoolery.games/fruit';
    shareBtn.textContent = 'Share';
    fallback.hidden = true;
    result.hidden = false;
    renderTop(d.top || [], d.total || 0);
  } catch {
    fail('Network hiccup. Try again.');
  } finally {
    goBtn.disabled = false;
  }
});

shareBtn.addEventListener('click', async () => {
  if (MOBILE) {
    try { await navigator.share({ text: shareText }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(shareText);
    shareBtn.textContent = 'Copied!';
    setTimeout(() => { shareBtn.textContent = 'Share'; }, 1500);
  } catch {
    fallback.textContent = shareText;
    fallback.hidden = false;
  }
});

loadTop();
</script>

</body>
</html>
