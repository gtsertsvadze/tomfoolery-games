<style>
  @font-face { font-family: "DM Sans"; src: url(/fonts/dm-sans.woff2) format("woff2"); font-weight: 400 600; font-style: normal; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    background: #FDF5E4; color: #2A211A; font-family: "DM Sans", system-ui, sans-serif;
    transition: background-color .2s; }
  body[data-state="rare"] { background: #EAF7EC; }
  body[data-state="common"] { background: #FFEBDD; }
  header { padding: 28px 40px; }
  .wm { font-size: 20px; font-weight: 600; letter-spacing: -.03em; color: inherit; text-decoration: none; }
  .wm b { display: inline-block; font-weight: inherit; color: #E4572E; transform: rotate(-14deg) translateY(-1px); }
  main { width: 100%; max-width: 800px; margin: 0 auto; padding: 48px 40px 40px; }
  section { display: flex; flex-direction: column; gap: 36px; }
  .block { display: flex; flex-direction: column; gap: 14px; }
  .icon { display: block; width: 120px; height: 120px; margin-left: -6px; }
  h1 { margin: 0; font-size: 80px; font-weight: 600; letter-spacing: -.035em; line-height: 1.02; }
  h1 b { font-weight: inherit; color: #E4572E; }
  .sub { margin: 0; font-size: 24px; color: #8A7B6E; }
  .sub s { text-decoration: line-through; text-decoration-color: #E4572E; text-decoration-thickness: 2px; }
  form { display: flex; align-items: flex-end; gap: 20px; }
  input { flex: 1; min-width: 0; font: inherit; font-size: 32px; letter-spacing: -.02em; padding: 8px 0 12px;
    color: inherit; background: transparent; border: 0; border-bottom: 2px solid #F2C9A8; border-radius: 0;
    outline: none; transition: border-color .15s; }
  input:focus { border-color: #E4572E; }
  input::placeholder { color: #8A7B6E; }
  button { font: inherit; cursor: pointer; border: 0; }
  #go { font-size: 16px; font-weight: 600; padding: 14px 28px; background: #E4572E; color: #FFF8EE;
    border-radius: 8px; transition: background-color .15s; }
  #go:hover { background: #C9481F; }
  #go:disabled { opacity: .6; cursor: default; }
  .hint { margin: 0; font-size: 13px; color: #8A7B6E; }
  .pill { align-self: flex-start; padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 600;
    background: #D3F1D8; color: #1F6B38; }
  body[data-state="common"] .pill { background: #FFE9A8; color: #7A5A00; }
  .fruit { margin: 0; font-size: 144px; font-weight: 600; letter-spacing: -.045em; line-height: .95;
    color: #2F9A55; overflow-wrap: anywhere; }
  body[data-state="common"] .fruit { color: #E4572E; }
  .verdict { margin: 0; font-size: 24px; }
  #share { width: 100%; padding: 16px; font-size: 16px; font-weight: 600; background: #2A211A; color: #FFF8EE;
    border-radius: 8px; transition: opacity .15s; }
  #share:hover { opacity: .88; }
  #again { align-self: center; padding: 0; background: none; font-size: 13px; color: #8A7B6E;
    text-decoration: underline; text-underline-offset: 3px; }
  html:has(#share-sheet[open]) { overflow: hidden; }
  #share-sheet { width: min(460px, calc(100% - 32px)); max-height: 90vh; max-height: 90dvh;
    padding: 28px; border: 0; border-radius: 24px; color: #2A211A; background: #FFF8EE;
    box-shadow: 0 24px 80px #2A211A33; }
  #share-sheet[open] { animation: sheet-in .18s ease-out; }
  #share-sheet::backdrop { background: #2A211A66; }
  .share-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .share-heading h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.03em; }
  #share-close { display: grid; place-items: center; flex-shrink: 0; width: 44px; height: 44px;

  .share-intro { margin: 8px 0 24px; font-size: 14px; color: #756557; }
  .share-targets { display: flex; gap: 8px; margin-bottom: 24px; }
  .share-target { display: flex; flex: 1; min-width: 0; flex-direction: column; align-items: center;
    gap: 10px; padding: 4px 0; border-radius: 12px; color: inherit; background: none;
    text-decoration: none; font-size: 13px; }
  .share-target-icon { display: grid; place-items: center; width: 56px; height: 56px;
    border-radius: 50%; background: #F2E6D7; }

  #s-wa .share-target-icon { background: #D3F1D8; color: #1F6B38; }
  #s-x .share-target-icon { background: #2A211A; color: #FFF8EE; }
  #s-ig .share-target-icon { background: #FFD6DF; color: #AA365F; }

  .share-action { display: flex; align-items: center; gap: 14px; padding: 14px 12px; border-radius: 12px;
    color: inherit; background: none; text-align: left; font-size: 15px; font-weight: 500; }
  .share-action svg, #share-close svg { width: 22px; height: 22px; flex-shrink: 0; }
  .share-action:hover, #share-close:hover, .share-target:hover { background: #2A211A0A; }
  #share-sheet button:disabled { opacity: .45; cursor: default; }

  #share-copy-value { width: 100%; min-height: 140px; padding: 12px; border: 1px solid #E9DCCB;
    border-radius: 8px; font: inherit; font-size: 14px; color: inherit; background: #FDF5E4; resize: vertical; }
  @keyframes sheet-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .label { margin: 0 0 10px; font-size: 13px; font-weight: 500; color: #8A7B6E; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 24px 110px 1fr auto;
    gap: 10px 12px; align-items: center; font-size: 16px; }
  li { display: contents; }
  .rank, .count { color: #8A7B6E; font-variant-numeric: tabular-nums; }
  .count { text-align: right; }
  .nm { font-weight: 500; text-transform: capitalize; }
  .bar { height: 12px; border-radius: 6px; width: var(--w); min-width: 8px; background: var(--c); }
  footer { margin-top: auto; padding: 24px; text-align: center; font-size: 12px; color: #8A7B6E; }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: #2A211A; text-decoration: underline; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid #E4572E; outline-offset: 3px; }
  input:focus-visible { outline: none; }
  [hidden] { display: none !important; }
  @media (max-width: 639px) {
    body { padding: 0 20px; }
    header { padding: 24px 0; }
    main { padding: 40px 0; }
    section { gap: 28px; }
    .block { gap: 12px; }
    .icon { width: 88px; height: 88px; }
    h1 { font-size: 44px; }
    .sub, .verdict { font-size: 18px; }
    form { flex-direction: column; align-items: stretch; }
    input { font-size: 24px; }
    #go { min-height: 48px; }
    .fruit { font-size: 76px; }
    #share-sheet { width: 100%; max-width: none; margin: auto 0 0; border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) { body, input, #go, #share { transition: none; } }
  @media (prefers-reduced-motion: reduce) { #share-sheet[open] { animation: none; } }
</style>

<main>

    <div class="block">

    </div>
    <div class="block">

      <span class="share-target-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></span>

    </button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 1 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 1)"/></svg>
      Copy link
    </button>
    <button class="share-action" id="s-img" type="button" aria-describedby="share-image-status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      Save image
    </button>

<footer>© 2026 · <a href="/privacy/">Privacy</a> · <a href="/contact/">Contact</a></footer>
<script>
const el = (id) => document.getElementById(id);
const body = document.body, form = el('form'), input = el('input'), goBtn = el('go'), hint = el('hint');
const promptEl = el('prompt'), resultEl = el('result'), pill = el('pill'), fruitEl = el('fruit');
const verdict = el('verdict'), shareBtn = el('share'), topEl = el('top'), list = el('list');
const shareSheet = el('share-sheet'), shareStatus = el('share-status'), imageStatus = el('share-image-status');
const SHARE_URL = 'https://tomfoolery.games/fruit';
const HINT = hint.textContent;
const TINTS = ['#FFE9A8', '#FFD9C2', '#FFD6DF', '#D3F1D8', '#D5E8FB'];
let shareText = '', cardFile = null;
let cardGeneration = 0, nativeSharePending = false;
el('s-native').hidden = typeof navigator.share !== 'function';

function show(state) {
  body.dataset.state = state;
  promptEl.hidden = state !== 'prompt';
  resultEl.hidden = state === 'prompt';
}

function renderRarest(rows, total) {
  list.textContent = '';
  topEl.hidden = !rows.length;
  rows.forEach((t, i) => {
    const pct = typeof t.pct === 'number' ? t.pct
      : (total > 0 && typeof t.count === 'number' ? Math.round(t.count / total * 1000) / 10 : t.rarerThan);
    const li = document.createElement('li');
    li.style.setProperty('--w', pct + '%');
    li.style.setProperty('--c', TINTS[i % TINTS.length]);
    for (const [tag, cls, text] of [['span', 'rank', i + 1], ['span', 'nm', t.fruit], ['div', 'bar', ''],
                                    ['span', 'count', pct + '%']]) {
      const n = document.createElement(tag);
      n.className = cls; n.textContent = text; li.appendChild(n);
    }
    list.appendChild(li);
  });
}

// "medlar" -> "M _ _ _ _ _"; the answer stays secret, like a Wordle grid.
const mask = (s) => [...s].map((c, i) => i === 0 ? c.toUpperCase() : /\p{L}/u.test(c) ? '_' : c).join(' ');
const filled = (r) => Math.min(10, Math.max(1, Math.round(r / 10)));
const squares = (r, rare) => (rare ? '\u{1F7E9}' : '\u{1F7E7}').repeat(filled(r)) + '\u{2B1C}'.repeat(10 - filled(r));

function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  ctx.fill();
}

async function makeCard(fruit, rarerThan, rare, pillText) {
  const F = '"DM Sans", system-ui, sans-serif';
  await Promise.all(['600 88px', '500 48px', '400 48px'].map((f) => document.fonts.load(f + ' "DM Sans"')));
  const img = new Image();
  img.src = '/icons/name-a-fruit.svg';
  await img.decode();
  const strong = rare ? '#2F9A55' : '#E4572E', soft = rare ? '#D3F1D8' : '#FFE9A8';
  const c = document.createElement('canvas');
  c.width = 1080; c.height = 1920;
  const ctx = c.getContext('2d');
  ctx.fillStyle = rare ? '#EAF7EC' : '#FFEBDD';
  ctx.fillRect(0, 0, 1080, 1920);

  // Wordmark with the tilted accent "o".
  let x = 96;
  ctx.font = '600 56px ' + F; ctx.fillStyle = '#2A211A';
  ctx.fillText('tomf', x, 290); x += ctx.measureText('tomf').width;
  const ow = ctx.measureText('o').width;
  ctx.save(); ctx.translate(x + ow / 2, 290 - 20 - 3); ctx.rotate(-14 * Math.PI / 180);
  ctx.fillStyle = '#E4572E'; ctx.fillText('o', -ow / 2, 20); ctx.restore();
  x += ow; ctx.fillText('olery', x, 290);

  ctx.drawImage(img, 96, 380, 180, 180);

  // Pill.
  ctx.font = '600 40px ' + F;
  const pw = ctx.measureText(pillText).width + 56;
  ctx.fillStyle = soft; rrect(ctx, 96, 640, pw, 76, 20);
  ctx.fillStyle = rare ? '#1F6B38' : '#7A5A00'; ctx.textBaseline = 'middle';
  ctx.fillText(pillText, 96 + 28, 640 + 38); ctx.textBaseline = 'alphabetic';

  // Letter tiles: first letter shown, the rest blank.
  const chars = [...fruit], tiles = chars.filter((ch) => ch !== ' ').length, spaces = chars.length - tiles;
  const s = Math.min(150, Math.floor((888 - (tiles - 1) * 16) / (tiles + spaces * 0.5)));
  let tx = 96; const ty = 790;
  chars.forEach((ch, i) => {
    if (ch === ' ') { tx += s / 2; return; }
    ctx.fillStyle = i === 0 ? strong : soft; rrect(ctx, tx, ty, s, s, Math.round(s * 0.14));
    if (i === 0) {
      ctx.fillStyle = '#FFF8EE'; ctx.font = '600 ' + Math.round(s * 0.55) + 'px ' + F;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ch.toUpperCase(), tx + s / 2, ty + s / 2 + s * 0.03);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
    tx += s + 16;
  });

  // Rarity squares.
  const sy = ty + s + 64;
  for (let i = 0; i < 10; i++) {
    ctx.fillStyle = i < filled(rarerThan) ? strong : 'rgba(42,33,26,0.08)';
    rrect(ctx, 96 + i * 88, sy, 72, 72, 12);
  }

  const by = sy + 72 + 130;
  ctx.fillStyle = '#2A211A'; ctx.font = '600 88px ' + F;
  ctx.fillText('Rarer than ' + rarerThan + '%', 96, by);
  ctx.fillStyle = '#8A7B6E'; ctx.font = '400 48px ' + F;
  ctx.fillText('of players.', 96, by + 70);
  ctx.fillStyle = '#2A211A'; ctx.font = '500 48px ' + F;
  ctx.fillText('Can you name a rarer fruit?', 96, 1470);
  ctx.font = '600 44px ' + F;
  ctx.fillText('tomfoolery.games/fruit', 96, 1550);

  const blob = await new Promise((res, rej) => c.toBlob((b) => b ? res(b) : rej(new Error('toBlob')), 'image/png'));
  return new File([blob], 'tomfoolery-fruit.png', { type: 'image/png' });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const answer = input.value.trim().toLowerCase();
  if (!answer) return;
  hint.textContent = HINT;
  goBtn.disabled = true;
  try {
    const r = await fetch('/api/fruit/answer', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ answer })
    });
    const d = await r.json();
    if (!d.ok) {
      hint.textContent = d.error || 'Try again.';
      input.select();
      return;
    }
    const pct = d.count / d.total * 100;
    const isRare = pct < 1;
    fruitEl.textContent = d.fruit[0].toUpperCase() + d.fruit.slice(1);
    if (isRare) {
      const top = Math.max(0.1, Math.round(pct * 10) / 10);
      pill.textContent = 'Top ' + top + '%';
      verdict.textContent = 'Rarer than ' + d.rarerThan + '% of players. Show-off.';
    } else {
      pill.textContent = 'Crowd favourite';
      verdict.textContent = 'You and ' + Math.round(pct) + '% of humanity said ' + d.fruit + '.';
    }
    shareText = ['\u{1F34E} Name a Fruit', mask(d.fruit), squares(d.rarerThan, isRare),
      'Rarer than ' + d.rarerThan + '% of players. Can you beat it?', SHARE_URL].join('\n');
    el('s-wa').href = 'https://wa.me/?text=' + encodeURIComponent(shareText);
    el('s-x').href = 'https://x.com/intent/post?text=' + encodeURIComponent(shareText);
    cardFile = null;
    const generation = ++cardGeneration;
    imageStatus.textContent = 'Preparing your image...';
    syncShareOptions();
    makeCard(d.fruit, d.rarerThan, isRare, pill.textContent).then((f) => {
      if (generation !== cardGeneration) return;
      cardFile = f;
      imageStatus.textContent = '';
      syncShareOptions();
    }).catch(() => {
      if (generation !== cardGeneration) return;
      imageStatus.textContent = 'The image could not be created. You can still share your text + link.';
      syncShareOptions();
    });
    renderRarest(d.rarest || [], d.total);
    show(isRare ? 'rare' : 'common');
    window.scrollTo(0, 0);
  } catch {
    hint.textContent = 'Network hiccup. Try again.';
  } finally {
    goBtn.disabled = false;
  }
});

el('again').addEventListener('click', () => {
  shareSheet.close();
  cardGeneration++;
  cardFile = null;
  show('prompt');
  input.value = '';
  input.focus();
});

function syncShareOptions() {
  el('s-ig').disabled = !cardFile || nativeSharePending;
  el('s-img').disabled = !cardFile;
  el('s-native').disabled = nativeSharePending;
}

async function copyText(text, message) {
  el('share-copy-fallback').hidden = true;
  try {
    await navigator.clipboard.writeText(text);
    shareStatus.textContent = message;
  } catch {
    shareStatus.textContent = 'Copy it below, then paste it wherever you like.';
    el('share-copy-fallback').hidden = false;
    el('share-copy-value').value = text;
    el('share-copy-value').focus();
    el('share-copy-value').select();
  }
}

shareBtn.addEventListener('click', () => {
  shareStatus.textContent = '';
  el('share-copy-fallback').hidden = true;
  syncShareOptions();
  shareSheet.showModal();
});
el('share-close').addEventListener('click', () => shareSheet.close());
shareSheet.addEventListener('close', () => shareBtn.focus());
shareSheet.addEventListener('click', (e) => {
  if (e.target !== shareSheet) return;
  const r = shareSheet.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) shareSheet.close();
});

el('s-text').addEventListener('click', () => copyText(shareText, 'Text + link copied. Paste it into any app.'));
el('s-link').addEventListener('click', () => copyText(SHARE_URL, 'Link copied.'));

function saveImage() {
  if (!cardFile) return;
  const a = document.createElement('a');
  const url = URL.createObjectURL(cardFile);
  a.href = url;
  a.download = cardFile.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
el('s-img').addEventListener('click', () => {
  saveImage();
  shareStatus.textContent = 'Image download started. Upload it to your story or send it to a friend.';
});

function canShareImage() {
  try {
    return !!cardFile && typeof navigator.share === 'function' &&
      !!navigator.canShare?.({ files: [cardFile] });
  } catch { return false; }
}

async function shareToApps(instagram = false) {
  if (nativeSharePending) return;
  if (instagram && !canShareImage()) {
    saveImage();
    shareStatus.textContent = 'Image download started. Open Instagram and upload it to a story or post.';
    return;
  }
  const data = instagram ? { files: [cardFile] } : { text: shareText };
  shareStatus.textContent = instagram
    ? 'Choose Instagram in the next menu. If it is not listed, use Save image and upload it in Instagram.' : '';
  nativeSharePending = true;
  syncShareOptions();
  try {
    // Keep share() in the original click: awaiting image generation loses the user gesture on Safari.
    await navigator.share(data);
  } catch (e) {
    if (e.name !== 'AbortError') {
      shareStatus.textContent = instagram
        ? 'Use Save image, then upload it in Instagram.'
        : 'Sharing is unavailable here. Copy your text + link or choose an app above.';
    }
  } finally {
    nativeSharePending = false;
    syncShareOptions();
  }
}
el('s-ig').addEventListener('click', () => shareToApps(true));
el('s-native').addEventListener('click', () => shareToApps());
</script>
